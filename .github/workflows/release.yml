name: Release

on:
   push:
      branches: [master]
      paths:
         - package.json

permissions:
   contents: write

jobs:
   release:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v7
           with:
              submodules: recursive

         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: latest

         # npm registry is the source of truth for "already published", not
         # git tags — handles versions published manually (outside CI) too,
         # like the initial 0.1.0/0.1.2 releases were.
         - name: Check if package.json version is new
           id: check
           run: |
              LOCAL_VERSION=$(node -p "require('./package.json').version")
              PUBLISHED_VERSION=$(npm view tlottie version 2>/dev/null || echo "0.0.0")
              echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
              if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
              else
                echo "changed=false" >> "$GITHUB_OUTPUT"
              fi

         - uses: actions/setup-node@v7
           if: steps.check.outputs.changed == 'true'
           with:
              node-version: 24
              registry-url: https://registry.npmjs.org

         - name: Install Rust toolchain
           if: steps.check.outputs.changed == 'true'
           uses: dtolnay/rust-toolchain@stable
           with:
              targets: wasm32-unknown-unknown

         - name: Install dependencies
           if: steps.check.outputs.changed == 'true'
           run: bun install --frozen-lockfile

         # Build once, test the packed artifacts, then publish those same
         # artifacts without a second prepublishOnly rebuild.
         - name: Lint
           if: steps.check.outputs.changed == 'true'
           run: bun run lint

         - name: Build
           if: steps.check.outputs.changed == 'true'
           run: bun run build

         - name: Test WASM loader
           if: steps.check.outputs.changed == 'true'
           run: bun run test

         - name: Test installed package in framework projects
           if: steps.check.outputs.changed == 'true'
           run: |
              bunx playwright install --with-deps chromium
              bun run test:consumers

         - name: Check Vite 6 and 7 configuration compatibility
           if: steps.check.outputs.changed == 'true'
           env:
              CONSUMER_ADAPTER: core
           run: |
              CONSUMER_VITE=6.4.4 bun run test:consumers
              CONSUMER_VITE=7.3.7 bun run test:consumers

         - name: Upload consumer screenshots and results
           if: always() && steps.check.outputs.changed == 'true'
           uses: actions/upload-artifact@v7
           with:
              name: consumer-tests
              path: |
                 .consumer-tests/*/*.png
                 .consumer-tests/*/results.json

         - name: Publish to npm
           if: steps.check.outputs.changed == 'true'
           run: npm publish --access public --ignore-scripts
           env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

         - name: Create GitHub Release
           if: steps.check.outputs.changed == 'true'
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              gh release create "v${{ steps.check.outputs.version }}" \
                --title "v${{ steps.check.outputs.version }}" \
                --generate-notes
